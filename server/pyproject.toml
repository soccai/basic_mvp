[project]
name = "lifeos-voice-server"
version = "0.1.0"
description = "LifeOS Voice Interaction MVP — local-first voice server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiosqlite>=0.19.0",
    "faster-whisper>=0.10.0",
    "piper-tts>=1.2.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "httpx>=0.25.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

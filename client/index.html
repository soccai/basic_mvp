<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LifeOS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Rejection Overlay (shown when another tab is connected) -->
    <div id="rejection-overlay" class="hidden">
        <div class="rejection-content">
            <h1 class="logo">LifeOS</h1>
            <p class="rejection-message">Another tab is already connected.</p>
            <p class="rejection-hint">Only one session can be active at a time.</p>
            <button id="retry-connection">Retry</button>
        </div>
    </div>

    <!-- Home / Idle View -->
    <div id="home-view">
        <h1 class="logo">LifeOS</h1>
        <p id="connection-id" class="connection-id"></p>
        <p id="status-text">What do you want to move forward right now?</p>
        <div class="controls">
            <button id="mic-button" aria-label="Start recording">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <button id="timeline-button" aria-label="Show timeline">Timeline</button>
        </div>
    </div>

    <!-- Listening Indicator -->
    <div id="listening-indicator" class="hidden">
        <div class="pulse-ring"></div>
        <p>Listening...</p>
    </div>

    <!-- Session Surface (overlay) -->
    <div id="session-surface" class="hidden">
        <div class="session-content">
            <div class="session-pulse"></div>
            <p class="session-label">Focus session in progress</p>
            <p id="session-timer">00:00</p>
            <button id="session-mic-button" aria-label="Speak in session">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <div class="session-text-input">
                <input id="session-text" type="text" placeholder="Type here..." autocomplete="off" />
            </div>
            <button id="end-session-button">Tap to end</button>
        </div>
    </div>

    <!-- Timeline Surface -->
    <div id="timeline-surface" class="hidden">
        <div class="timeline-header">
            <h2>Timeline</h2>
            <button id="timeline-close" aria-label="Close timeline">Back</button>
        </div>
        <div id="timeline-list"></div>
    </div>

    <script src="ws.js"></script>
    <script src="voice.js"></script>
    <script src="session-surface.js"></script>
    <script src="timeline-surface.js"></script>
    <script src="app.js"></script>
</body>
</html>
